name: Build 3D prototype
on:
  push:
    branches: [codex/3d-map-and-hero]
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/runebound-godot-4.5.1
            ~/.local/share/godot/export_templates/4.5.1.stable
          key: runebound-godot-4.5.1-linux-v1
      - name: Install Godot and SDK
        run: |
          bash BUILD-ANDROID-CODEX.sh --engine-only
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"
      - name: Configure SDK
        run: |
          mkdir -p "$HOME/.config/godot" vyrnspire-3d/builds
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path.home()/'.config/godot/editor_settings-4.5.tres'
          p.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "'+os.environ['JAVA_HOME']+'"\nexport/android/android_sdk_path = "'+os.environ['ANDROID_HOME']+'"\n')
          PY
      - name: Test and export prototype
        run: |
          set -o pipefail
          export GODOT_SILENCE_ROOT_WARNING=1
          GODOT="$HOME/.local/bin/runebound-godot-4.5.1"
          "$GODOT" --headless --path vyrnspire-3d --import 2>&1 | tee vyrnspire-3d/builds/import.log
          ! grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' vyrnspire-3d/builds/import.log
          "$GODOT" --headless --path vyrnspire-3d --script res://tests/test_preview.gd 2>&1 | tee vyrnspire-3d/builds/test.log
          ! grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|FAIL:' vyrnspire-3d/builds/test.log
          VYRNSPIRE_CAPTURE="$PWD/vyrnspire-3d/builds/preview.png" xvfb-run -a "$GODOT" --path vyrnspire-3d --script res://tests/capture.gd
          "$GODOT" --headless --path vyrnspire-3d --export-release Android "$PWD/vyrnspire-3d/builds/preview-unsigned.apk" 2>&1 | tee vyrnspire-3d/builds/export.log
          ! grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' vyrnspire-3d/builds/export.log
          unzip -tqq vyrnspire-3d/builds/preview-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vyrnspire-3D-preview
          path: vyrnspire-3d/builds/
          retention-days: 1
