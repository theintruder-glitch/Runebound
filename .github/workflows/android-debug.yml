name: Runebound Android verified test APK

on:
  pull_request:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: Fresh-install test or original historical signing certificate
        type: choice
        default: fresh-install-only
        options:
          - fresh-install-only
          - original

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.5.1
      XDG_CONFIG_HOME: ${{ runner.temp }}/runebound/config
      XDG_DATA_HOME: ${{ runner.temp }}/runebound/data
      XDG_CACHE_HOME: ${{ runner.temp }}/runebound/cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # Command-line tools 12.0 run on Java 17; newer releases may need Java 21.
          cmdline-tools-version: '11076708'
          packages: 'platform-tools'

      - name: Install SDK for the non-Gradle ARM64 export
        run: sdkmanager 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35'

      - name: Install verified Godot 4.5.1 and matching Android template
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/runebound/godot"
          mkdir -p "$install_dir" "$XDG_DATA_HOME/godot/export_templates/$GODOT_VERSION.stable"
          cd "$install_dir"
          base="https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl --fail --location --retry 3 "$base/$editor" -o "$editor"
          curl --fail --location --retry 3 "$base/$templates" -o "$templates"
          grep -F " $editor" SHA512-SUMS.txt | sha512sum --check --strict
          grep -F " $templates" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$editor"
          unzip -p "$templates" templates/android_debug.apk > "$XDG_DATA_HOME/godot/export_templates/$GODOT_VERSION.stable/android_debug.apk"
          unzip -p "$templates" templates/version.txt > "$XDG_DATA_HOME/godot/export_templates/$GODOT_VERSION.stable/version.txt"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          printf 'GODOT_BIN=%s/Godot_v%s-stable_linux.x86_64\n' "$install_dir" "$GODOT_VERSION" >> "$GITHUB_ENV"

      - name: Import, run Android suites, build and verify APK
        env:
          SIGNING_MODE: ${{ inputs.signing_mode || 'fresh-install-only' }}
          # PR builds never receive signing secrets. Original mode fails closed.
          ORIGINAL_KEYSTORE_B64: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'original' && secrets.ANDROID_DEBUG_KEYSTORE_BASE64 || '' }}
          ORIGINAL_KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'original' && secrets.ANDROID_DEBUG_KEY_ALIAS || '' }}
          ORIGINAL_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'original' && secrets.ANDROID_DEBUG_KEY_PASSWORD || '' }}
        run: python3 tools/build_android.py --mode "$SIGNING_MODE"

      - name: Upload verified APK and installation warning
        uses: actions/upload-artifact@v4
        with:
          name: Runebound-Android-${{ inputs.signing_mode || 'fresh-install-only' }}
          path: |
            builds/*/*.apk
            builds/*/*.sha256
            builds/*/*.json
            builds/*/*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runebound-Android-build-logs
          path: builds/*/logs/
          if-no-files-found: ignore
          retention-days: 7
