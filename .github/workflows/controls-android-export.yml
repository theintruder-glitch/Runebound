name: Prepare Android test export
on:
  push:
    branches:
      - codex/mobile-controls-assignment-fix
permissions:
  contents: read
jobs:
  unsigned-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/runebound-godot-4.5.1
            ~/.local/share/godot/export_templates/4.5.1.stable
          key: runebound-godot-4.5.1-linux-v1
      - name: Install Godot and Android build tools
        run: |
          bash BUILD-ANDROID-CODEX.sh --engine-only
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"
      - name: Configure unsigned export
        run: |
          mkdir -p "$HOME/.config/godot" builds
          python3 - <<'PY'
          import os, pathlib
          p=pathlib.Path.home()/'.config/godot/editor_settings-4.5.tres'
          p.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "'+os.environ['JAVA_HOME']+'"\nexport/android/android_sdk_path = "'+os.environ['ANDROID_HOME']+'"\n')
          p=pathlib.Path('export_presets.cfg')
          s=p.read_text().replace('package/signed=true','package/signed=false',1).replace('version/code=42','version/code=43',1).replace('version/name="0.32.0-drowned-oath"','version/name="0.32.1-controls-test"',1)
          p.write_text(s)
          PY
      - name: Import and export unsigned APK
        run: |
          set -o pipefail
          export GODOT_SILENCE_ROOT_WARNING=1
          "$HOME/.local/bin/runebound-godot-4.5.1" --headless --path . --import 2>&1 | tee builds/import.log
          ! grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' builds/import.log
          "$HOME/.local/bin/runebound-godot-4.5.1" --headless --path . --export-release Android "$PWD/builds/Vyrnspire-unsigned.apk" 2>&1 | tee builds/export.log
          ! grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' builds/export.log
          unzip -tqq builds/Vyrnspire-unsigned.apk
          tar -czf builds/android-build-tools.tar.gz -C "$ANDROID_HOME/build-tools/35.0.1" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-unsigned-for-local-signing
          path: |
            builds/Vyrnspire-unsigned.apk
            builds/android-build-tools.tar.gz
            builds/import.log
            builds/export.log
          retention-days: 1
