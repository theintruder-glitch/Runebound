name: Test and build VYRNSPIRE
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_android:
        description: Export release APK using the original signing secrets
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: runebound-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/runebound-godot-4.5.1
            ~/.local/share/godot/export_templates/4.5.1.stable
          key: runebound-godot-4.5.1-linux-v1
      - name: Install verified pinned engine and templates
        run: bash BUILD-ANDROID-CODEX.sh --engine-only
      - name: Import and run isolated regression suites
        run: |
          export GODOT_BIN="$HOME/.local/bin/runebound-godot-4.5.1"
          "$GODOT_BIN" --headless --path . --import 2>&1 | tee import.log
          ! grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' import.log
          python3 tools/test_rename_save_path.py
          python3 tools/run_tests.py
      - name: Export Windows and exercise compiled pack
        run: bash BUILD-WINDOWS-CODEX.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vyrnspire-tests-and-Windows
          path: |
            builds/Vyrnspire-Windows-*.zip
            builds/test-results/
            builds/windows-pack-tests/
            builds/logs/
            import.log
          if-no-files-found: error
          retention-days: 14
  android:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    needs: test-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/runebound-godot-4.5.1
            ~/.local/share/godot/export_templates/4.5.1.stable
          key: runebound-godot-4.5.1-linux-v1
      - name: Restore original release signing identity outside the checkout
        env:
          ORIGINAL_KEY_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64,os,pathlib
          value=os.environ.get('ORIGINAL_KEY_B64','')
          if not value: raise SystemExit('Original release key is missing. Configure ANDROID_RELEASE_KEYSTORE_BASE64; no replacement key will be generated.')
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'runebound-original.jks'
          path.write_bytes(base64.b64decode(value,validate=True));path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('GODOT_ANDROID_KEYSTORE_RELEASE_PATH='+str(path)+'\n')
          PY
      - name: Export and verify release APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: bash BUILD-ANDROID-CODEX.sh --accept-sdk-licenses --skip-test
      - uses: actions/upload-artifact@v4
        with:
          name: Vyrnspire-Android-release
          path: builds/Runebound-Godot-*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vyrnspire-Android-diagnostics
          path: |
            builds/logs/
            builds/android-pack-tests/
          retention-days: 14
